<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า — Body Scent</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Page-specific styles (order form) */
    .page-head { padding-block: var(--space-5) var(--space-4); text-align: center; }
    .page-head p { max-width: 480px; margin-inline: auto; }

    .form-wrap {
      max-width: 560px;
      margin-inline: auto;
      padding: var(--space-4);
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }
    .field { margin-bottom: var(--space-3); }
    .field label {
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
      color: var(--ink);
    }
    .field input,
    .field textarea {
      width: 100%;
      padding: 0.75rem 0;
      font: inherit;
      font-size: 1rem;
      color: var(--ink);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line-strong);
      border-radius: 0;
      transition: border-color 0.3s var(--ease);
    }
    .field textarea { resize: vertical; min-height: 5.5rem; line-height: 1.7; }
    .field input:focus,
    .field textarea:focus { outline: none; border-bottom-color: var(--gold); }
    .field input::placeholder,
    .field textarea::placeholder { color: var(--beige-dark); opacity: 0.7; }
    .field .hint { margin: 0.4rem 0 0; font-size: 0.8rem; }
    .btn:disabled { opacity: 0.5; cursor: wait; }
    .form-actions { margin-top: var(--space-4); }

    @media (max-width: 480px) {
      .nav { display: flex; gap: var(--space-2); }
      .form-wrap { padding: var(--space-3) var(--space-2); }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">BODY SCENT</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-head">
      <div class="container">
        <h1 style="font-size: clamp(2rem, 3vw + 1rem, 3rem);">สั่งซื้อสินค้า</h1>
        <hr class="rule">
        <p style="margin-top: var(--space-3);">กรอกข้อมูลด้านล่าง เราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อและแจ้งการชำระเงิน</p>
      </div>
    </section>

    <section class="section section--white" style="padding-top: var(--space-5);">
      <div class="container">
        <div class="form-wrap">
          <form id="orderForm">
            <div class="field">
              <label for="customerName">ชื่อลูกค้า</label>
              <input type="text" id="customerName" name="customerName" autocomplete="name" required>
            </div>

            <div class="field">
              <label for="contact">เบอร์โทร / Line</label>
              <input type="text" id="contact" name="contact" autocomplete="tel" required>
            </div>

            <div class="field">
              <label for="items">รายการสินค้า</label>
              <textarea id="items" name="items" rows="2" required></textarea>
              <p class="hint">เติมให้อัตโนมัติจากสินค้าที่เลือก แก้ไขได้หากต้องการสั่งหลายรายการ</p>
            </div>

            <div class="field">
              <label for="total">จำนวนเงินรวม (บาท)</label>
              <input type="text" id="total" name="total" inputmode="numeric" required>
            </div>

            <div class="field">
              <label for="note">หมายเหตุ</label>
              <textarea id="note" name="note" rows="3" placeholder="ที่อยู่จัดส่งหรือข้อความเพิ่มเติม (ถ้ามี)"></textarea>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn--gold btn--block">ยืนยันสั่งซื้อ</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">&copy; Body Scent</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
